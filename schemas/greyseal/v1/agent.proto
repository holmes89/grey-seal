syntax = "proto3";

package schemas.greyseal.v1;


import "google/protobuf/timestamp.proto";

// AgentRun is the persisted state of one agentic coding-task run.
message AgentRun {
  string uuid = 1;

  // provider: "aider" (code-editing runs in disposable containers) or
  // "ollama:<model>" (in-process tool-calling runs, e.g. design → draft
  // tickets, with tools supplied over MCP).
  string provider = 2;

  // repo_url is set for "aider" runs; empty for "ollama:<model>" runs, which
  // have no repository.
  string repo_url = 3;

  // status: "running" | "idle" | "terminated" | "error".
  string status = 4;

  // session_id is the provider's session identifier — for Claude this is a
  // Managed Agents session ID, usable to build a Console trace-view link.
  string session_id = 5;

  // pr_url is populated once the agent opens a pull request, if it does.
  string pr_url = 6;

  // error holds a human-readable failure reason when status is "error".
  string error = 7;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
