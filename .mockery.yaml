quiet: false
disable-version-string: false
with-expecter: false
packages:
  github.com/holmes89/grey-seal/lib/greyseal/agent:
    config:
      dir: "lib/greyseal/agent/mocks"
      outpkg: "mocks"
      mockname: "Mock{{.InterfaceName}}"
      filename: "mock_{{.InterfaceName | lower}}.go"
    interfaces:
      AgentService:
      AgentRunRepository:
      SessionRunner:
      PullRequestOpener:
      ToolProvider:
      ToolSession:
  github.com/holmes89/grey-seal/lib/greyseal/conversation:
    config:
      dir: "lib/greyseal/conversation/mocks"
      outpkg: "mocks"
      mockname: "Mock{{.InterfaceName}}"
      filename: "mock_{{.InterfaceName | lower}}.go"
  github.com/holmes89/grey-seal/lib/greyseal/draft:
    config:
      dir: "lib/greyseal/draft/mocks"
      outpkg: "mocks"
      mockname: "Mock{{.InterfaceName}}"
      filename: "mock_{{.InterfaceName | lower}}.go"
    interfaces:
      DraftService:
      Generator:
  github.com/holmes89/grey-seal/lib/greyseal/resource:
    config:
      dir: "lib/greyseal/resource/mocks"
      outpkg: "mocks"
      mockname: "Mock{{.InterfaceName}}"
      filename: "mock_{{.InterfaceName | lower}}.go"
